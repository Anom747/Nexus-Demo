name: Deploy NEXUS Demo

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexus-demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public demo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage exact public assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -m 0755 _site
          install -m 0644 index.html _site/index.html
          install -m 0644 styles.css _site/styles.css
          install -m 0644 app.js _site/app.js
          install -m 0644 .nojekyll _site/.nojekyll
          test "$(find _site -mindepth 1 -maxdepth 1 | wc -l)" -eq 4

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

      - name: Deploy public demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
