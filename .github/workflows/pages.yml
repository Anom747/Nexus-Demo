name: Deploy NEXUS Demo

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexus-demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public demo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # official Node 24 merge

      - name: Stage exact public assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -m 0755 _site
          install -m 0644 index.html _site/index.html
          install -m 0644 styles.css _site/styles.css
          install -m 0644 app.js _site/app.js
          install -m 0644 .nojekyll _site/.nojekyll
          test "$(find _site -mindepth 1 -maxdepth 1 | wc -l)" -eq 4

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # official upload-artifact v7 update
        with:
          path: _site
          retention-days: 1

      - name: Deploy public demo
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # official Node 24 merge
